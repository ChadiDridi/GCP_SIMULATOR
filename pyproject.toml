[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcp-simulator"
version = "2.0.0"
description = "Local GCP services simulator — like Azurite for Azure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chadi Dridi", email = "chadi.dridi@elyadata.com" }]
keywords = ["gcp", "simulator", "emulator", "local", "development", "google-cloud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "cryptography>=42.0.5",
    "click>=8.1.7",
    "rich>=13.0.0",
    "docker>=7.0.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
gcp-sim = "gcp_simulator.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["gcp_simulator"]

[tool.hatch.build.targets.sdist]
include = [
    "gcp_simulator/",
    "alembic.ini",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
